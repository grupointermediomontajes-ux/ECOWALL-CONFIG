name: Compilar ECOWALL (Windows + Mac)

on:
  # Solo a mano (Actions → Run workflow). No se lanza con las etiquetas v…: al publicar una release, GitHub
  # crea su etiqueta y eso lanzaba otra compilación que sobrescribía los archivos de la release publicada.
  workflow_dispatch:

# En la «Release» (borrador) v<versión de package.json> solo van los instaladores:
#   Windows -> .exe · Mac -> .dmg (universal: chip Apple e Intel).
# La versión web no se compila aquí (la app en un solo .html sale con scripts/build-single-html.ps1).
jobs:
  # ------------------------------------------------------------------ RELEASE
  # Crea el borrador de la release (o reutiliza el de esa versión si ya existe).
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Crear o reutilizar el borrador de la release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            **Windows:** instalador `.exe`.
            **Mac:** instalador `.dmg`, universal: Mac con chip Apple (M1/M2/M3…) e Intel. Requiere macOS 13 o superior; la primera vez, clic derecho sobre la app → «Abrir».

            Al abrir la app de escritorio por primera vez se pide la carpeta de proyectos, que debe contener precios.xlsx.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # Una release ya publicada no se toca: cada actualización necesita un número de versión nuevo.
          PUBLISHED=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\" and .draft == false) | .id" | head -n 1)
          if [ -n "$PUBLISHED" ]; then
            echo "::error::La versión $TAG ya está publicada. Sube el número de versión (package.json, src-tauri/tauri.conf.json y src-tauri/Cargo.toml) y vuelve a compilar."
            exit 1
          fi
          ID=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
              -f name="ECOWALL Configurador $TAG" -f body="$BODY" -F draft=true --jq .id)
          fi
          echo "Release $TAG (id $ID)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ WINDOWS
  windows:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: windows

      - name: Instalar dependencias
        run: npm install

      - name: Descargar librerías 3D (GLTFLoader, OBJExporter)
        run: npm run vendor

      - name: Generar iconos
        run: npm run icons

      - name: Compilar y subir a la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}

  # ------------------------------------------------------------------ MAC
  # App universal (Mac con chip Apple e Intel). GitHub a veces no tiene máquinas Mac libres
  # («The job was not acquired by Runner…»), sobre todo las de chip Apple, así que se pide a la vez
  # una Intel y una de chip Apple: la que consiga máquina sube los archivos a la release (si salen
  # las dos, la segunda solo reemplaza el mismo archivo). Basta con que una termine bien.
  # Se compila en pasos separados para localizar cualquier fallo. A la release solo sube el .dmg.
  mac:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: mac-universal-${{ matrix.runner }}

      - name: Versiones (para diagnóstico)
        run: |
          sw_vers
          xcodebuild -version || true
          rustc --version
          cargo --version
          node --version

      - name: Instalar dependencias
        run: npm install

      - name: Descargar librerías 3D (GLTFLoader, OBJExporter)
        run: npm run vendor

      - name: Generar iconos
        run: npm run icons

      - name: "1) Compilar la app de Mac universal (.app)"
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: "2) Crear el instalador .dmg (hdiutil, sin Finder)"
        run: |
          set -euxo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP_PATH=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n 1)
          rm -rf staging && mkdir -p staging dist
          cp -R "$APP_PATH" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "ECOWALL Configurador" -srcfolder staging -ov -format UDZO "dist/ECOWALL-Configurador_${VERSION}_mac-universal.dmg"
          ls -la dist

      - name: "3) Subir el .dmg a la release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/*.dmg --clobber

